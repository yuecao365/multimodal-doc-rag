<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Architecture: PDF pages are indexed three ways (dense text, BM25 keywords, page images with ColQwen2.5). A question searches all three routes, the rankings are merged, a retrieval agent searches again and picks the best pages, a vision language model answers with page citations, and code verifies every quote.">
  <style>
    .bg { fill: #ffffff; }
    .frame { fill: #f6f8fa; stroke: #e4e8ec; }
    .card { fill: #ffffff; stroke: #d8dee4; }
    .route { fill: #ffffff; stroke: #c9d7ee; }
    .agent { fill: #f6f3ff; stroke: #b9a8f7; }
    .pill { fill: #ffffff; stroke: #8c959f; stroke-width: 1.3; }
    .t { fill: #1f2328; font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .s { fill: #656d76; font: 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sec { fill: #8c959f; font: 600 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .1em; }
    .k { font: 700 10px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .1em; }
    .ka { fill: #6e56cf; } .kl { fill: #2f6fd6; } .kc { fill: #6e7781; }
    .dot { fill: #2f6fd6; }
    .flow { fill: none; stroke: #8c959f; stroke-width: 1.6; stroke-linecap: round; }
    .build { fill: none; stroke: #b0b8c1; stroke-width: 1.4; stroke-dasharray: 5 4; stroke-linecap: round; }
    .head { fill: #8c959f; }
    .headb { fill: #b0b8c1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .frame { fill: #11161d; stroke: #262c36; }
      .card, .route { fill: #161b22; stroke: #30363d; }
      .agent { fill: #1d1838; stroke: #5d4bb5; }
      .pill { fill: #161b22; stroke: #6e7681; }
      .t { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .sec { fill: #6e7681; }
      .ka { fill: #b4a2ff; } .kl { fill: #79a8f2; } .kc { fill: #9198a1; }
      .dot { fill: #79a8f2; }
      .flow { stroke: #6e7681; } .head { fill: #6e7681; }
      .build { stroke: #484f58; } .headb { fill: #484f58; }
    }
  </style>
  <defs>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="head" d="M0 0.5L10 5L0 9.5z"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="headb" d="M0 0.5L10 5L0 9.5z"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="430" rx="14"/>

  <!-- input -->
  <rect class="pill" x="24" y="181" width="122" height="42" rx="21" filter="url(#sh)"/>
  <text class="t" x="85" y="207" text-anchor="middle">PDF pages</text>

  <!-- retrieval routes -->
  <rect class="frame" x="180" y="38" width="300" height="290" rx="14"/>
  <text class="sec" x="200" y="64">3 RETRIEVAL ROUTES</text>

  <path class="build" marker-end="url(#b)" d="M146 202 C175 202 170 111 198 111"/>
  <path class="build" marker-end="url(#b)" d="M146 202 C175 202 170 193 198 193"/>
  <path class="build" marker-end="url(#b)" d="M146 202 C175 202 170 275 198 275"/>

  <rect class="route" x="200" y="80" width="260" height="62" rx="10" filter="url(#sh)"/>
  <circle class="dot" cx="218" cy="103" r="4"/>
  <text class="t" x="231" y="108">Dense text</text>
  <text class="s" x="231" y="127">search text by meaning</text>

  <rect class="route" x="200" y="162" width="260" height="62" rx="10" filter="url(#sh)"/>
  <circle class="dot" cx="218" cy="185" r="4"/>
  <text class="t" x="231" y="190">BM25</text>
  <text class="s" x="231" y="209">exact keyword match</text>

  <rect class="route" x="200" y="244" width="260" height="62" rx="10" filter="url(#sh)"/>
  <circle class="dot" cx="218" cy="267" r="4"/>
  <text class="t" x="231" y="272">Page image</text>
  <text class="s" x="231" y="291">ColQwen2.5, no text parsing needed</text>

  <!-- question -->
  <rect class="pill" x="255" y="360" width="150" height="42" rx="21" filter="url(#sh)"/>
  <text class="t" x="330" y="386" text-anchor="middle">Question</text>
  <path class="flow" marker-end="url(#a)" d="M330 360 V331"/>

  <!-- fusion -->
  <path class="flow" marker-end="url(#a)" d="M460 111 C492 111 488 193 518 193"/>
  <path class="flow" marker-end="url(#a)" d="M460 193 H518"/>
  <path class="flow" marker-end="url(#a)" d="M460 275 C492 275 488 193 518 193"/>
  <rect class="card" x="520" y="160" width="112" height="66" rx="10" filter="url(#sh)"/>
  <text class="k kc" x="534" y="180">CODE</text>
  <text class="t" x="534" y="200">RRF fusion</text>
  <text class="s" x="534" y="217">merge rankings</text>

  <!-- agent -->
  <path class="flow" marker-end="url(#a)" d="M632 193 H663"/>
  <rect class="agent" x="665" y="132" width="152" height="122" rx="12" filter="url(#sh)"/>
  <text class="k ka" x="681" y="153">AGENT</text>
  <text class="t" x="681" y="174">Retrieval agent</text>
  <text class="s" x="681" y="196">searches again,</text>
  <text class="s" x="681" y="213">reads pages,</text>
  <text class="s" x="681" y="230">keeps the best 5</text>

  <!-- answer and check -->
  <path class="flow" marker-end="url(#a)" d="M817 193 C836 193 830 125 848 125"/>
  <rect class="card" x="850" y="92" width="130" height="66" rx="10" filter="url(#sh)"/>
  <text class="k kl" x="864" y="112">LLM CALL</text>
  <text class="t" x="864" y="132">VLM answer</text>
  <text class="s" x="864" y="149">cites page + quote</text>
  <path class="flow" marker-end="url(#a)" d="M915 158 V184"/>

  <rect class="card" x="850" y="186" width="130" height="66" rx="10" filter="url(#sh)"/>
  <text class="k kc" x="864" y="206">CODE</text>
  <text class="t" x="864" y="226">Citation check</text>
  <text class="s" x="864" y="243">quotes verified</text>
  <path class="flow" marker-end="url(#a)" d="M915 252 V290"/>

  <rect class="pill" x="845" y="292" width="140" height="42" rx="21" filter="url(#sh)"/>
  <text class="t" x="915" y="318" text-anchor="middle">Cited answer</text>

  <!-- legend -->
  <path class="build" marker-end="url(#b)" d="M520 385 H556"/>
  <text class="s" x="566" y="389">build index (once)</text>
  <path class="flow" marker-end="url(#a)" d="M700 385 H736"/>
  <text class="s" x="746" y="389">per question</text>
</svg>
